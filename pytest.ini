[pytest]
# PyPlayKit Test Configuration

# Register custom pytest markers to avoid "unknown mark" warnings
markers =
    smoke: Smoke test suite - critical path validation
    sanity: Sanity test suite - basic functionality checks
    regression: Regression test suite - comprehensive validation
    data: Data validation and comparison tests
    api: API endpoint tests
    database: Database validation tests
    ui: User interface tests
    integration: Integration tests across multiple components
    flaky: Flaky tests that may require retries
    slow: Tests that take longer to execute
    negative: Negative test cases for error handling

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Console output options
console_output_style = progress
addopts = --strict-markers -v

# Logging
log_cli = false
log_cli_level = INFO
